name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Project and Build Debug APK
        run: |
          if [ -d "IrrigationPortalApp" ]; then
            cd IrrigationPortalApp
          fi

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Automatically create dummy mipmap folders and icons so build never fails on missing icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
            convert -size 48x48 xc:#0D47A1 app/src/main/res/mipmap-$density/ic_launcher.png 2>/dev/null || touch app/src/main/res/mipmap-$density/ic_launcher.png
            convert -size 48x48 xc:#0D47A1 app/src/main/res/mipmap-$density/ic_launcher_round.png 2>/dev/null || touch app/src/main/res/mipmap-$density/ic_launcher_round.png
          done

          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: IrrigationPortal-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
