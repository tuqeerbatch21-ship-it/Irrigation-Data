name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Project and Build Debug APK
        run: |
          if [ -d "IrrigationPortalApp" ]; then
            cd IrrigationPortalApp
          fi
          echo "=== Checking uploaded files ==="
          find . -maxdepth 6 -not -path '*/.*'

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="com.irrigation.portal"//g' app/src/main/AndroidManifest.xml
          fi

          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: IrrigationPortal-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
