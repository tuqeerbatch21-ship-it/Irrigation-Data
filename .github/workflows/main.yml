name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare AndroidX and Manifest Config
        run: |
          if [ -d "IrrigationPortalApp" ]; then
            cd IrrigationPortalApp
          fi
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          sed -i 's/package="com.irrigation.portal"//g' app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          if [ -d "IrrigationPortalApp" ]; then
            cd IrrigationPortalApp
          fi
          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: IrrigationPortal-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
